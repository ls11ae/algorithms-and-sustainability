<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route planning in Dortmund: interactive demo</title>
<link rel="stylesheet" href="../../support/fonts/lato.css">
<style>
  :root {
    --ink: #282a2e; --grey: #6b6e73; --line: #d6d8db; --panel: rgba(255, 255, 255, 0.93);
    --blue: #0A97D9; --orange: #E8700A; --green: #3F7E44; --red: #DD1367;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffffff; color: var(--ink);
               font-family: "Lato", "LatoLatin", "Helvetica Neue", Arial, sans-serif; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; }
  #panel { position: absolute; left: 10px; top: 10px; background: var(--panel); border: 1px solid var(--line);
           border-radius: 6px; padding: 8px 10px; font-size: 14px; line-height: 1.35; max-width: 330px;
           box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08); user-select: none; }
  #panel h1 { font-size: 15px; margin: 0 0 6px 0; font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  button { font: inherit; font-size: 13px; padding: 3px 8px; border: 1px solid #b9bcc0; border-radius: 4px;
           background: #ffffff; color: var(--ink); cursor: pointer; }
  button.on { background: var(--ink); color: #ffffff; border-color: var(--ink); }
  button.run { font-weight: 700; }
  #stats { margin-top: 6px; font-variant-numeric: tabular-nums; }
  #stats b { font-weight: 700; }
  .hint { color: var(--grey); font-size: 12px; margin-top: 4px; }
  #legend { position: absolute; left: 10px; top: 10px; background: var(--panel); border: 1px solid var(--line);
            border-radius: 6px; padding: 6px 10px; font-size: 15px; line-height: 1.4; display: none;
            font-variant-numeric: tabular-nums; }
  .key { display: inline-block; width: 22px; height: 4px; vertical-align: middle; margin-right: 6px;
                 border-radius: 2px; }
  #attrib { position: absolute; right: 6px; bottom: 4px; font-size: 11px; color: var(--grey);
            background: rgba(255, 255, 255, 0.8); padding: 1px 4px; border-radius: 3px; }
  #attrib a { color: var(--grey); }
  #loading { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); font-size: 18px;
             color: var(--grey); }
  body.noui #panel { display: none; }
  body.legend #panel { display: none; }
  body.legend #legend { display: block; }
  body.compact #panel h1, body.compact #algos, body.compact .speedrow, body.compact .hint, body.compact .metric { display: none; }
  body.compact #panel { font-size: 16px; padding: 6px 9px; line-height: 1.3; }
  body.compact button { font-size: 15px; padding: 3px 9px; }
  body.compact #stats .hint { display: block; font-size: 13px; }
  #more { padding: 3px 6px; }
  body.compact.algosfilter #algos { display: flex; }
</style>
</head>
<body>
<canvas id="base"></canvas>
<canvas id="search"></canvas>
<canvas id="top"></canvas>
<div id="loading">Loading the Dortmund street network …</div>
<div id="panel">
  <h1>Dortmund by bike: shortest paths</h1>
  <div class="row" id="algos">
    <button data-algo="dijkstra">Dijkstra</button>
    <button data-algo="bidir">Bidirectional</button>
    <button data-algo="astar">A*</button>
    <button data-algo="alt">ALT</button>
    <button data-algo="ch">CH</button>
    <button data-algo="compare">fast vs quiet</button>
  </div>
  <div class="row">
    <button id="run" class="run">▶ Run</button>
    <button id="instant">Result</button>
    <button id="clear">Clear</button>
    <span style="flex:1"></span>
    <button data-metric="fast" class="metric">fast</button>
    <button data-metric="quiet" class="metric">quiet</button>
    <button id="more" title="more controls">⋯</button>
  </div>
  <div class="row speedrow">
    <span class="hint" style="margin:0">speed</span>
    <button data-speed="0.1">slow</button>
    <button data-speed="1">normal</button>
    <button data-speed="6">fast</button>
  </div>
  <div id="stats"></div>
  <div class="hint">Click: start · second click (or Shift-click): target · drag: move · wheel: zoom · double-click: whole map</div>
</div>
<div id="legend"></div>
<div id="attrib">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors (ODbL) · demo: Algorithms and Sustainability, TU Dortmund, CC BY 4.0</div>
<script src="routing.js"></script>
<script src="demo.js"></script>
</body>
</html>
